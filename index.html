<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<title>Plants vs. Zombies</title>
<script src="vendor/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
body.upload-mode{display:flex;flex-direction:column;align-items:stretch;justify-content:center;overflow-x:hidden;overflow-y:auto}
body.game-mode{overflow:hidden}
#canvas-container{display:none;width:100vw;height:100vh;position:fixed;inset:0;justify-content:center;align-items:center;background:#000;overflow:hidden}
#canvas-container:fullscreen{width:100%;height:100%}
canvas#canvas{display:block;background:#000;outline:0}

#save-toggle{
  display:none;position:fixed;right:14px;bottom:14px;z-index:9999;
  padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.2);
  background:rgba(20,20,35,.75);color:#ddd;font-size:12px;cursor:pointer;
}
#save-toggle:hover{background:rgba(20,20,35,.95)}

#save-panel{
  display:none;position:fixed;right:14px;bottom:50px;z-index:9999;
  width:220px;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
  background:rgba(20,20,35,.95);
}
#save-panel.open{display:block}
#save-panel button{
  display:block;width:100%;margin-bottom:6px;padding:7px 10px;
  border-radius:5px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);color:#eee;font-size:12px;cursor:pointer;
  text-align:left;
}
#save-panel button:last-of-type{margin-bottom:0}
#save-panel button:hover{background:rgba(255,255,255,.14)}
#save-panel button#btn-clear{color:#ff9a9a}
#save-status{margin-top:8px;font-size:11px;color:#9c9cae;line-height:1.4}
</style>
</head>
<body class="upload-mode">

<div id="upload-screen">
  <h1>Plants vs. Zombies</h1>
  <p>Automatically loading resources...</p>
</div>

<div id="canvas-container">
  <canvas id="canvas" width="800" height="600" tabindex="0"></canvas>
</div>

<button id="save-toggle">Save data</button>
<div id="save-panel">
  <button id="btn-export">Export save</button>
  <button id="btn-import">Import save</button>
  <button id="btn-clear">Clear save</button>
  <div id="save-status">loading...</div>
  <input id="import-file-input" type="file" accept=".zip,.dat,.sav,.v4" style="display:none">
</div>

<script>
"use strict";

// The game writes its saves under /saves/userdata/ (users.dat,
// user<N>.dat, game<N>_<M>.dat|.v4) — not /userdata like the file names
// suggest. /saves/cache32 also lives next to it, but that's just a
// rebuildable shader/particle cache, not save data, so we leave it alone.
var SAVE_MOUNT = "/saves/userdata";

var collectedFiles = new Map();
var gameStarted = false;
var canvas = document.getElementById("canvas");
var saveToggle = document.getElementById("save-toggle");
var savePanel  = document.getElementById("save-panel");
var statusEl   = document.getElementById("save-status");

saveToggle.addEventListener("click", function(){
  savePanel.classList.toggle("open");
});
document.addEventListener("click", function(e){
  if(!savePanel.classList.contains("open")) return;
  if(savePanel.contains(e.target) || e.target===saveToggle) return;
  savePanel.classList.remove("open");
});

function setStatus(t){ statusEl.textContent = t; }

// Only one syncfs() at a time is safe. If a save is already in flight
// when another is requested, remember it and run once the first finishes
// instead of overlapping the two.
var syncInFlight = false, syncPending = false;
function persist(cb){
  if(syncInFlight){ syncPending = true; return; }
  syncInFlight = true;
  Module.FS.syncfs(false, function(err){
    syncInFlight = false;
    if(err){
      console.warn("save sync failed:", err);
      setStatus("Save failed to write: " + err);
    } else {
      setStatus("Last saved " + new Date().toLocaleTimeString());
    }
    if(syncPending){ syncPending = false; persist(); }
    cb && cb(err);
  });
}

function listSaveFiles(){
  var files = [];
  var entries;
  try{ entries = Module.FS.readdir(SAVE_MOUNT); }catch(e){ return files; }
  for(var i=0;i<entries.length;i++){
    var name = entries[i];
    if(name==="."||name==="..") continue;
    files.push(SAVE_MOUNT + "/" + name);
  }
  return files;
}

document.getElementById("btn-export").addEventListener("click", async function(){
  if(typeof JSZip === "undefined"){
    setStatus("Export is unavailable (vendor/jszip.min.js didn't load).");
    return;
  }
  setStatus("Preparing export...");
  persist(async function(){
    var files = listSaveFiles();
    if(!files.length){
      setStatus("Nothing to export yet — play a level first.");
      return;
    }
    var zip = new JSZip();
    for(var i=0;i<files.length;i++){
      try{ zip.file(files[i].slice(1), Module.FS.readFile(files[i])); }catch(e){}
    }
    var blob = await zip.generateAsync({type:"blob"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "pvz-save-" + new Date().toISOString().slice(0,10) + ".zip";
    a.click();
    URL.revokeObjectURL(url);
    setStatus("Exported " + files.length + " file(s).");
  });
});

document.getElementById("btn-import").addEventListener("click", function(){
  document.getElementById("import-file-input").click();
});

document.getElementById("import-file-input").addEventListener("change", async function(){
  var file = this.files[0];
  this.value = "";
  if(!file) return;

  setStatus("Importing...");
  try{
    var count = 0;
    if(file.name.toLowerCase().endsWith(".zip")){
      if(typeof JSZip === "undefined"){
        setStatus("Can't read .zip files (vendor/jszip.min.js didn't load). Try a single save file instead.");
        return;
      }
      var zip = await JSZip.loadAsync(await file.arrayBuffer());
      var writes = [];
      zip.forEach(function(relPath, entry){
        if(entry.dir) return;
        writes.push(entry.async("uint8array").then(function(data){
          var clean = relPath.replace(/^\/+/, "");
          // Accept a zip exported by this same build (paths already
          // rooted at SAVE_MOUNT) as well as one from before the mount
          // path was fixed (paths rooted at the old, wrong /userdata).
          var abs;
          if(clean.indexOf("saves/userdata/") === 0) abs = "/" + clean;
          else if(clean.indexOf("userdata/") === 0) abs = SAVE_MOUNT + "/" + clean.slice("userdata/".length);
          else abs = SAVE_MOUNT + "/" + clean;
          var dir = abs.slice(0, abs.lastIndexOf("/"));
          try{ Module.FS.mkdirTree(dir); }catch(e){}
          Module.FS.writeFile(abs, data);
          count++;
        }));
      });
      await Promise.all(writes);
    } else {
      var data = new Uint8Array(await file.arrayBuffer());
      try{ Module.FS.mkdirTree(SAVE_MOUNT); }catch(e){}
      Module.FS.writeFile(SAVE_MOUNT + "/" + file.name, data);
      count = 1;
    }

    if(!count){
      setStatus("That file didn't contain any save data.");
      return;
    }

    persist(function(err){
      if(err){
        setStatus("Imported, but couldn't write to storage.");
        return;
      }
      setStatus("Imported " + count + " file(s). Reloading...");
      setTimeout(function(){ location.reload(); }, 900);
    });
  }catch(e){
    setStatus("Import failed: " + e.message);
  }
});

document.getElementById("btn-clear").addEventListener("click", function(){
  if(!confirm("Delete all saves stored in this browser? Export a backup first if you want to keep them.")) return;
  var files = listSaveFiles();
  for(var i=0;i<files.length;i++){
    try{ Module.FS.unlink(files[i]); }catch(e){}
  }
  persist(function(){ setStatus("Saves cleared."); });
});

document.addEventListener("visibilitychange", function(){
  if(document.hidden && gameStarted) persist();
});
window.addEventListener("beforeunload", function(){
  if(gameStarted) persist();
});
setInterval(function(){ if(gameStarted) persist(); }, 20000);

// onRuntimeInitialized fires once the wasm is ready but before callMain.
// We mount IndexedDB storage and pull any existing saves in here, then
// resolve this promise so startGame() knows it's safe to launch.
var resolveModuleReady;
var moduleReadyPromise = new Promise(function(res){ resolveModuleReady = res; });

var Module = {
  canvas: canvas,
  noInitialRun: true,
  onRuntimeInitialized: function(){
    try{
      Module.FS.mkdirTree(SAVE_MOUNT);
      Module.FS.mount(Module.FS.filesystems.IDBFS, {}, SAVE_MOUNT);
    }catch(e){
      console.error("could not mount save storage:", e);
      setStatus("Save storage unavailable in this browser.");
      resolveModuleReady();
      return;
    }
    setStatus("Loading saves...");
    Module.FS.syncfs(true, function(err){
      if(err){
        console.warn("could not load existing saves:", err);
        setStatus("Couldn't load existing saves.");
      } else {
        setStatus("Saves loaded.");
      }
      resolveModuleReady();
    });
  },
  onAbort: function(e){ console.error("wasm aborted:", e); },
  print:    console.log,
  printErr: console.warn
};

async function autoLoadResources(){
  try{
    var r=await fetch("main.pak"); if(!r.ok) throw new Error("main.pak not found");
    collectedFiles.set("main.pak", new File([await r.arrayBuffer()], "main.pak"));
    var props=["partner.xml","partner.xml.sig","partner.xml.sig2","partner_logo.jpg"];
    for(var i=0;i<props.length;i++){
      var r2=await fetch("properties/"+props[i]); if(!r2.ok) throw new Error(props[i]+" not found");
      collectedFiles.set("properties/"+props[i], new File([await r2.arrayBuffer()], props[i]));
    }
    startGame();
  }catch(e){
    document.getElementById("upload-screen").innerHTML="<p style='color:red;'>Failed to load: "+e.message+"</p>";
  }
}

async function startGame(){
  document.body.classList.remove("upload-mode");
  document.body.classList.add("game-mode");
  document.getElementById("upload-screen").style.display="none";
  document.getElementById("canvas-container").style.display="flex";

  // Wait for the save mount to be ready before writing game assets, so
  // nothing races with the IndexedDB populate.
  await moduleReadyPromise;

  for(var [path,file] of collectedFiles.entries()){
    var data=new Uint8Array(await file.arrayBuffer());
    var parts=path.split("/"), dir="/";
    for(var i=0;i<parts.length-1;i++){
      dir+=(dir==="/"?"":"/")+parts[i];
      try{Module.FS.mkdir(dir);}catch(e){}
    }
    Module.FS.writeFile("/"+path, data);
  }

  Module.callMain([]);
  gameStarted=true;
  saveToggle.style.display="block";
}

autoLoadResources();
</script>

<script src="pvz-portable.js"></script>
</body>
</html>
